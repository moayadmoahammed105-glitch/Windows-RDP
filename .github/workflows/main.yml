name: Windows Free RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
        Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False
        Set-Service -Name "TermService" -StartupType Automatic
        Start-Service -Name "TermService"

    - name: Create RDP Account
      run: |
        $Password = ConvertTo-SecureString "Password1234!" -AsPlainText -Force
        if (-not (Get-LocalUser -Name "runneradmin" -ErrorAction SilentlyContinue)) {
            New-LocalUser "runneradmin" -Password $Password -FullName "RDP User" -Description "RDP Admin User"
            Add-LocalGroupMember -Group "Administrators" -Member "runneradmin"
            Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin"
        }

    - name: Download & Install Tailscale
      run: |
        winget install --id Tailscale.Tailscale -e --accept-source-agreements --accept-package-agreements
        & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --accept-routes

    - name: Display Connection Info
      run: |
        $tsIP = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
        Write-Host "===================================="
        Write-Host "Tailscale IP: $tsIP"
        Write-Host "Username: runneradmin"
        Write-Host "Password: Password1234!"
        Write-Host "===================================="

    - name: Keep Alive Loop
      run: |
        while ($true) {
          Start-Sleep -Seconds 3600
        }
